# paperSU: build a Xiaomi / Redmi kernel and package it as an AnyKernel3 zip.
#
# ── 与「Build Kernel OnePlus.yml」的关系 ──────────────────────────────────────
# 两者**不能合并**，因为源码模型根本不同：
#
#   一加那套：AOSP `repo` 工具 + OnePlusOSS 的 kernel_manifest 清单
#             + 全程依赖 vendor/oplus/* 补丁与 CONFIG_OPLUS_* 配置
#             内核源码在 kernel_platform/common/
#
#   小米这套：MiCode/Xiaomi_Kernel_OpenSource **每个机型一个普通内核树**
#             没有清单、没有 vendor/oplus（一加那些补丁在小米树上不存在）
#             实测 6 个分支的源码**都在仓库根目录**，没有 common/
#
# 所以本工作流只做小米这一路，构建逻辑复用 scripts/build-kernel-generic.sh，
# 它会从内核自己的 Makefile 读版本并自动选工具链与目标（4.x→GCC / 5.10+→LLVM）。
#
# ── 机型选择 ─────────────────────────────────────────────────────────────────
# 分支名来自官方对照表（MiCode/Xiaomi_Kernel_OpenSource 的 README 分支）。
# ⚠️ 新机型的分支名**带 `bsp-` 前缀**（例如 bsp-duchamp-u-oss 而不是 duchamp-u-oss）。
# 完整列表：https://github.com/MiCode/Xiaomi_Kernel_OpenSource/tree/README
#
# ── 默认目标：红米 K20 Pro ────────────────────────────────────────────────────
# 默认输入已设成红米 K20 Pro，点一下就能编：
#     device_branch = raphael-p-oss          （官方表：Redmi K20 Pro, Android P）
#     defconfig     = raphael_user_defconfig
#
# 实测（读该分支真实 Makefile / ls-tree 得到，不是猜的）：
#     raphael-p-oss   Redmi K20 Pro   内核 4.14.83    配置 arch/arm64/configs/raphael_user_defconfig
#     cepheus-q-oss   Mi 9 / K20 Pro  内核 4.14.117   配置同名（另一个官方分支，Android Q）
#
# K20 Pro 是 **4.14 非 GKI** 设备，所以：
#   · 工具链必须用 **GCC**（不是 Clang）→ 工作流会按探测到的版本自动切到 GCC 步骤
#   · make 目标是 **Image.gz-dtb**（4.x 的复合镜像，dtb 已内含）→ 脚本自动选
#   · 配置在 arch/arm64/configs/ **顶层**，不需要 vendor/ 前缀
#
# ── 实测过的真实版本（供参考）────────────────────────────────────────────────
#   raphael-p-oss     红米 K20 Pro       4.14.83    gcc   Image.gz-dtb   ← 默认
#   sweet-r-oss       红米 Note 10 Pro   4.14.180   gcc   Image.gz-dtb
#   alioth-r-oss      红米 K40           4.19.113   gcc   Image.gz-dtb
#   rubens-s-oss      红米 K50           5.10.66    llvm  Image
#   mondrian-s-oss    红米 K60           5.10.81    llvm  Image
#   socrates-t-oss    红米 K60 Pro       5.15.41    llvm  Image
#   corot-t-oss       红米 K60 Ultra     5.15.78    llvm  Image
#
# ── 工具链来源说明（如实声明）────────────────────────────────────────────────
# 默认从 AOSP 的 android.googlesource.com 取 Clang。这台开发机在国内**访问不了**
# 那个域名，所以我**没能实际验证**下载 URL 一定可用。GitHub runner 在美国通常没问题；
# 若失败会明确报错停下（不会静默继续）。真不行就用 toolchain_source=url 自己给直链。
# ─────────────────────────────────────────────────────────────────────────────
name: Build Kernel Xiaomi

on:
  workflow_dispatch:
    inputs:
      device_branch:
        description: '机型分支（如 raphael-p-oss / mondrian-s-oss / bsp-duchamp-u-oss）'
        required: true
        default: 'raphael-p-oss'
        type: string
      kernel_repo:
        description: '内核仓库（默认小米官方；也可换成你自己的 fork）'
        required: false
        default: 'https://github.com/MiCode/Xiaomi_Kernel_OpenSource'
        type: string
      defconfig:
        description: 'defconfig（先跑一次看日志里的可用清单；老机型常在 vendor/ 下）'
        required: true
        default: 'raphael_user_defconfig'
        type: string
      arch:
        description: '目标架构'
        required: false
        default: 'arm64'
        type: string
      kmi:
        description: '产物命名用标签（如 redmi-k20pro）'
        required: false
        default: 'redmi-k20pro'
        type: string
      target:
        description: 'make 目标（留空 = 按内核版本自动选）'
        required: false
        default: ''
        type: string
      sublevel:
        description: '伪装 SUBLEVEL（留空 = 不改）'
        required: false
        default: ''
        type: string

      # ── paperSU / KernelSU 内置模式 ──
      ksu_enable:
        description: '内置 KernelSU / paperSU'
        required: false
        default: true
        type: boolean
      ksu_repo:
        description: 'KernelSU 内核源码仓库（取 kernel/ 用）。默认上游 SukiSU-Ultra；换成你自己的 PaperSU fork 也可以'
        required: false
        default: 'https://github.com/SukiSU-Ultra/SukiSU-Ultra'
        type: string
      ksu_ref:
        description: '分支/标签（默认 main；注意 builtin 分支没有 kernel/Kbuild，不能用）'
        required: false
        default: 'main'
        type: string
      ksu_package:
        description: '管理器包名 → KSU_MANAGER_PACKAGE'
        required: false
        default: 'top.becuy.eric.papersu'
        type: string
      ksu_size2:
        description: '管理器签名大小 → KSU_EXPECTED_SIZE2'
        required: false
        default: '0x036d'
        type: string
      ksu_hash2:
        description: '管理器签名 SHA-256 → KSU_EXPECTED_HASH2'
        required: false
        default: '14ea1b98c9f693f282a05022b8cf02dcbd2dd8e28c9d6b97bd6acfda1352f82f'
        type: string

      # ── 工具链 ──
      toolchain_source:
        description: 'aosp = 自动取 AOSP Clang；url = 用 clang_url；runner = 用 runner 自带'
        required: false
        default: 'aosp'
        type: choice
        options: [aosp, url, runner]
      clang_version:
        description: 'AOSP Clang 版本（留空 = 自动取最新 clang-r*）'
        required: false
        default: ''
        type: string
      clang_url:
        description: 'toolchain_source=url 时的 tar.gz 直链'
        required: false
        default: ''
        type: string

      # ── AnyKernel3 ──
      ak3:
        description: '打包 AnyKernel3 zip'
        required: false
        default: true
        type: boolean
      ak3_repo:
        description: 'AK3 模板来源'
        required: false
        default: 'https://github.com/Numbersf/AnyKernel3'
        type: string
      ak3_string:
        description: 'AK3 横幅文字（默认模板写的是一加，小米应改掉）'
        required: false
        default: 'paperSU Kernel'
        type: string

      extra_config:
        description: '额外打开的配置，逗号分隔（如 CONFIG_KPM=y）'
        required: false
        default: ''
        type: string
      extra_make:
        description: '额外 make 参数，逗号分隔'
        required: false
        default: ''
        type: string

concurrency:
  group: xiaomi-${{ github.ref }}-${{ inputs.device_branch }}-${{ inputs.defconfig }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # ── 1. 本仓库：拿 scripts/build-kernel-generic.sh ──
      - name: Checkout Action-Build (build script)
        uses: actions/checkout@v6

      # ── 2. 腾磁盘：内核树 + 编译产物很吃空间 ──
      - name: Free disk space
        run: |
          echo "--- before ---"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo apt-get clean
          echo "--- after ---"; df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bc bison flex libssl-dev libelf-dev zip unzip cpio \
            python3 python3-pip rsync kmod git curl xz-utils lz4 zstd file \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          # 32 位运行库：AOSP 的老 GCC 4.9 预编译包放在 prebuilts/gcc/**linux-x86**/
          # 下（注意不是 linux-x86_64），是 **32 位 x86 主机程序**。只有 64 位
          # 运行库的系统上 execve 会因为找不到 /lib/ld-linux.so.2 返回 ENOENT，
          # 于是内核的 gcc-wrapper.py 报出 "Is your PATH set correctly?"，
          # 一路传下去最终变成
          #   Cannot use CONFIG_CC_STACKPROTECTOR_STRONG: -fstack-protector-strong
          #   not supported by compiler
          # —— 这个报错完全指错方向，会让人去反复换工具链版本。
          # 逐个装、失败不致命，后面的步骤会真正验证工具链能不能跑。
          for p in libc6-i386 lib32stdc++6 lib32z1 lib32gcc-s1; do
            sudo apt-get install -y -qq --no-install-recommends "$p" \
              || echo "::notice::装不上 $p（跳过，后续会验证工具链是否真能运行）"
          done

      # ── 3. 内核源码（小米树很大，必须浅取单分支）──
      - name: Fetch Xiaomi kernel source
        run: |
          set -eu
          # 同上：仓库/分支有问题时立刻失败，不要跑去索要用户名
          export GIT_TERMINAL_PROMPT=0
          REPO='${{ inputs.kernel_repo }}'
          BRANCH='${{ inputs.device_branch }}'
          echo "仓库  : $REPO"
          echo "机型分支: $BRANCH"

          if ! git ls-remote --heads "$REPO" >/dev/null 2>&1; then
            echo "::error::无法访问内核仓库：$REPO"
            echo "::error::仓库名拼错 / 不存在 / 私有（runner 没有你的凭据）都会是这样"
            exit 1
          fi

          if ! git ls-remote --exit-code --heads "$REPO" "$BRANCH" >/dev/null 2>&1; then
            echo "::error::仓库 $REPO 里没有分支：$BRANCH"
            echo "::error::最常见的原因是新机型的分支名**带 bsp- 前缀**"
            echo "::error::  例如要写 bsp-duchamp-u-oss，不是 duchamp-u-oss"
            echo "::error::包含 '$BRANCH' 的可用分支："
            git ls-remote --heads "$REPO" | sed 's|.*refs/heads/|  |' | grep -i -- "$BRANCH" | head -20 || true
            echo "::error::（若上面为空，说明名字差得较远，请查官方对照表："
            echo "::error::  https://github.com/MiCode/Xiaomi_Kernel_OpenSource/tree/README ）"
            exit 1
          fi

          git clone --depth 1 --single-branch --branch "$BRANCH" "$REPO" kernel-src
          echo "--- 目录结构（判断源码是在根目录还是 common/）---"
          ls -1 kernel-src | head -30
          if [ -f kernel-src/common/Makefile ]; then
            echo "→ 检测到 common/：内核源码在 common/ 下"
          else
            echo "→ 没有 common/：内核源码在仓库根（小米官方树就是这种）"
          fi

      # ── 3b. 探测内核版本 —— 决定后面用 GCC 还是 Clang ──
      # 红米 K20 Pro（raphael-p-oss）是 4.14.83 ⇒ 必须走 GCC；
      # 而 5.10/5.15/6.x 走 Clang。这一步把版本导出，后面的步骤据此分支。
      - name: Detect kernel version
        run: |
          set -eu
          if [ -f kernel-src/common/Makefile ]; then
            MK=kernel-src/common/Makefile
            echo "→ 内核源码在 common/ 下"
          else
            MK=kernel-src/Makefile
            echo "→ 内核源码在仓库根（小米官方树就是这种）"
          fi
          V=$(sed -n 's/^VERSION *= *//p'    "$MK" | head -n1)
          P=$(sed -n 's/^PATCHLEVEL *= *//p' "$MK" | head -n1)
          S=$(sed -n 's/^SUBLEVEL *= *//p'   "$MK" | head -n1)
          [ -n "$V" ] && [ -n "$P" ] || { echo "ERROR: 读不出 VERSION/PATCHLEVEL"; exit 1; }
          echo "检测到内核版本：$V.$P.$S"
          echo "KVER_MAJOR=$V"     >> "$GITHUB_ENV"
          echo "KVER_FULL=$V.$P.$S" >> "$GITHUB_ENV"
          if [ "$V" = "4" ]; then
            echo "→ 4.x：将使用 GCC 工具链"
          else
            echo "→ $V.x：将使用 Clang(LLVM) 工具链"
          fi

      # ── 4. 先列出可用 defconfig，方便在日志里确认配置名对不对 ──
      - name: List available defconfigs
        run: |
          set -eu
          chmod +x scripts/build-kernel-generic.sh
          ./scripts/build-kernel-generic.sh --kernel-dir kernel-src \
            --arch '${{ inputs.arch }}' --list-defconfigs || true

      # ── 5a. 4.x 的 GCC 工具链（红米 K20 Pro 走这条）──
      - name: Setup GCC toolchain (for 4.x kernels)
        if: env.KVER_MAJOR == '4'
        run: |
          set -eu
          # 4.14 这类 Android 内核的标准工具链是 AOSP 的 aarch64-linux-android-4.9。
          # 优先取它；取不到或**跑不起来**就退回发行版的 aarch64-linux-gnu。
          BASE='https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9'
          USE_AOSP=0

          if curl -fsSL --max-time 90 -o gcc.tar.gz "$BASE/+archive/refs/heads/master.tar.gz" 2>/dev/null; then
            mkdir -p toolchain/gcc
            tar -xzf gcc.tar.gz -C toolchain/gcc
            rm -f gcc.tar.gz
            # 不能假设解压出来就是 bin/xxx —— 上一次就是踩了这个：直接去看
            # toolchain/gcc/bin/aarch64-linux-android-gcc，结果 No such file。
            # 所以先打印结构，并**递归**找 gcc 本体，再从真实路径反推前缀。
            echo "--- 归档解压后的结构（前 20 项）---"
            find toolchain/gcc -maxdepth 2 | head -n20
            # 注意：**-type f 匹配不到符号链接**，而工具链里的 gcc 常常是链到
            # gcc-4.9 的软链 —— 上一次可能就是因为这个没找到。所以两种类型都找。
            GCCBIN=$(find toolchain/gcc -maxdepth 5 \( -type f -o -type l \) \
                       -name 'aarch64-linux-android-gcc' 2>/dev/null | head -n1)
            if [ -z "$GCCBIN" ]; then
              GCCBIN=$(find toolchain/gcc -maxdepth 5 \( -type f -o -type l \) \
                         -name 'aarch64-linux-android-gcc-*' 2>/dev/null | head -n1)
            fi
            # ⚠ 必须**真正**验证它能不能运行。之前写成 `gcc --version | head -n1`，
            # 管道的退出码是 head 的、永远为 0，跑不起来也发现不了，
            # 错误被推到很后面而且换了面貌（伪装成"编译器不支持 -fstack-protector-strong"）。
            if [ -n "$GCCBIN" ] && [ -x "$GCCBIN" ] && "$GCCBIN" --version >/dev/null 2>&1; then
              GCCDIR=$(cd "$(dirname "$(dirname "$GCCBIN")")" && pwd)
              # 前缀从目录推导，不依赖二进制叫什么名字
              GCCPFX="$GCCDIR/bin/aarch64-linux-android-"
              USE_AOSP=1
            else
              echo "::warning::AOSP GCC 下载到了，但找不到可运行的 aarch64-linux-android-gcc"
              if [ -n "$GCCBIN" ]; then
                echo "--- file ---"; file "$GCCBIN" || true
                echo "--- ldd  ---"; ldd  "$GCCBIN" 2>&1 | head -n10 || true
              else
                echo "--- toolchain/gcc 下所有 aarch64* 条目（前 15 个，含目录/链接）---"
                find toolchain/gcc -maxdepth 5 -name 'aarch64*' 2>/dev/null | head -n15 || true
                echo "--- toolchain/gcc 下所有 bin 目录 ---"
                find toolchain/gcc -maxdepth 5 -type d -name bin 2>/dev/null | head -n5 || true
              fi
            fi
          else
            echo "::warning::AOSP GCC 下载失败（这台 runner 访问不了 android.googlesource.com？）"
          fi

          if [ "$USE_AOSP" = "1" ]; then
            echo "GCC_DIR=$GCCDIR" >> "$GITHUB_ENV"
            echo "GCC_PREFIX=$GCCPFX" >> "$GITHUB_ENV"
            echo "✅ 使用 AOSP GCC 4.9，前缀：$GCCPFX"
            "$GCCPFX"gcc --version | head -n1
          else
            echo "::warning::退回发行版 aarch64-linux-gnu GCC（$(aarch64-linux-gnu-gcc -dumpversion)，比 4.14 新很多）"
            # ⚠️ 用新 GCC 编老内核时，内核自带的 scripts/gcc-wrapper.py 会把
            # **每一个**警告都变成 error —— 它的 allowed_warnings 是空集，
            # 而且它**不检查 -Werror**，所以 `-Wno-error` 完全无效。
            # 新 GCC 会报出一堆当年不存在的警告（-Wformat 更精确、
            # -Warray-bounds 增强……），构建必然被打断。
            # 所以退回发行版 GCC 时一并要求绕过该 wrapper。
            echo "::warning::将同时跳过内核自带的 gcc-wrapper.py（它把任何 warning 当 error，-Wno-error 无效）"
            echo "NO_CC_WRAPPER=1" >> "$GITHUB_ENV"
            echo "GCC_PREFIX=aarch64-linux-gnu-" >> "$GITHUB_ENV"
            aarch64-linux-gnu-gcc --version | head -n1
          fi

      # ── 5b. Clang 工具链（5.x / 6.x 用；4.x 会跳过以省时间）──
      - name: Setup toolchain (AOSP Clang)
        if: inputs.toolchain_source == 'aosp' && env.KVER_MAJOR != '4'
        run: |
          set -eu
          # gitiles 的 +archive 接口只打包指定目录。版本号不写死：列目录取最新的
          # clang-r*，免得写死一个我这台机器无法验证的 tag。
          BASE='https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86'
          VER='${{ inputs.clang_version }}'
          if [ -z "$VER" ]; then
            VER=$(curl -fsSL "$BASE/+/refs/heads/main" \
                  | grep -o 'clang-r[0-9]\{6,\}' | sort -u | tail -n1 || true)
            [ -n "$VER" ] || { echo "ERROR: 无法从 $BASE 解析 clang 版本"; \
                               echo "       这台 runner 访问不了 android.googlesource.com？"; \
                               echo "       改用 toolchain_source=url 并提供 clang_url。"; exit 1; }
          fi
          echo "[+] 使用 $VER"
          mkdir -p toolchain/clang
          curl -fL --retry 3 -o clang.tar.gz "$BASE/+archive/refs/heads/main/$VER.tar.gz" \
            || { echo "ERROR: 下载 $VER 失败"; exit 1; }
          tar -xzf clang.tar.gz -C toolchain/clang
          rm -f clang.tar.gz
          toolchain/clang/bin/clang --version | head -n1

      - name: Setup toolchain (custom URL)
        if: inputs.toolchain_source == 'url' && env.KVER_MAJOR != '4'
        run: |
          set -eu
          [ -n "${{ inputs.clang_url }}" ] || { echo "ERROR: 选了 url 但没给 clang_url"; exit 1; }
          mkdir -p toolchain/clang
          curl -fL --retry 3 -o clang.tar.gz "${{ inputs.clang_url }}" || { echo "ERROR: 下载失败"; exit 1; }
          tar -xzf clang.tar.gz -C toolchain/clang
          rm -f clang.tar.gz
          if [ ! -x toolchain/clang/bin/clang ]; then
            inner=$(find toolchain/clang -maxdepth 3 -type f -name clang | head -n1 || true)
            [ -n "$inner" ] || { echo "ERROR: 包里找不到 clang"; exit 1; }
            base=$(dirname "$(dirname "$inner")")
            mv "$base" toolchain/clang2 && rm -rf toolchain/clang && mv toolchain/clang2 toolchain/clang
          fi
          toolchain/clang/bin/clang --version | head -n1

      - name: Setup toolchain (runner clang)
        if: inputs.toolchain_source == 'runner' && env.KVER_MAJOR != '4'
        run: |
          which clang ld.lld llvm-ar
          clang --version | head -n1
          echo "注意：用 runner 自带 clang 属于碰运气；失败就换 toolchain_source=aosp"

      # ── 6. paperSU 源码（内置模式用）──
      - name: Fetch paperSU source
        if: inputs.ksu_enable
        run: |
          set -eu
          # GIT_TERMINAL_PROMPT=0：仓库不存在/私有时**立刻失败**，
          # 而不是去索要用户名然后报一句看不懂的
          # "could not read Username for 'https://github.com': No such device or address"。
          export GIT_TERMINAL_PROMPT=0
          REPO='${{ inputs.ksu_repo }}'
          REF='${{ inputs.ksu_ref }}'

          echo "仓库: $REPO"
          echo "分支: $REF"

          # ── 预检：仓库存在吗？是公开可读的吗？──
          if ! git ls-remote --heads "$REPO" >/dev/null 2>&1; then
            echo "::error::无法访问 KSU 仓库：$REPO"
            echo "::error::常见原因：仓库名拼错 / 仓库不存在 / 是私有仓库（runner 没有你的凭据）"
            echo "::error::用上游请填 https://github.com/SukiSU-Ultra/SukiSU-Ultra"
            echo "::error::要用自己的 fork 就把它设为公开，或改用可访问的地址"
            exit 1
          fi

          # ── 预检：分支存在吗？不存在就把可用分支列出来 ──
          if [ -n "$REF" ] && ! git ls-remote --exit-code --heads "$REPO" "$REF" >/dev/null 2>&1; then
            echo "::error::仓库 $REPO 里没有分支：$REF"
            echo "::error::可用分支（前 20 个）："
            git ls-remote --heads "$REPO" | sed 's|.*refs/heads/|  |' | head -20
            exit 1
          fi

          if [ -n "$REF" ]; then
            git clone --depth 1 --branch "$REF" "$REPO" ksu-src
          else
            git clone --depth 1 "$REPO" ksu-src
          fi

          # ── 预检：真的是一个完整的 KernelSU 源码树吗？──
          # setup.sh 会把 drivers/kernelsu 链到 kernel/，而 kernel/Kbuild 与
          # kernel/Kconfig 提供编译规则。少了 Kbuild 编译必然失败
          # （上游的 builtin 分支就是这样，只有 3 个顶层文件）。
          missing=""
          [ -f ksu-src/kernel/setup.sh ] || missing="$missing kernel/setup.sh"
          [ -f ksu-src/kernel/Kbuild ]   || missing="$missing kernel/Kbuild"
          [ -f ksu-src/kernel/Kconfig ]  || missing="$missing kernel/Kconfig"
          if [ -n "$missing" ]; then
            echo "::error::这个分支不是一个完整的 KernelSU 源码树，缺少：$missing"
            echo "::error::顶层内容："
            ls -1 ksu-src | head -20 | sed 's/^/  /'
            echo "::error::换一个分支试试（上游 SukiSU-Ultra 用 main）"
            exit 1
          fi
          echo "✅ KSU 源码就绪（kernel/setup.sh + Kbuild + Kconfig 都在）"

      # ── 7. 编译 ──
      - name: Build kernel
        env:
          KSU_ENABLE: ${{ inputs.ksu_enable }}
          KSU_PACKAGE: ${{ inputs.ksu_package }}
          KSU_SIZE2: ${{ inputs.ksu_size2 }}
          KSU_HASH2: ${{ inputs.ksu_hash2 }}
          ARCH_IN: ${{ inputs.arch }}
          DEFCONFIG_IN: ${{ inputs.defconfig }}
          TARGET_IN: ${{ inputs.target }}
          KMI_IN: ${{ inputs.kmi }}
          SUBLEVEL_IN: ${{ inputs.sublevel }}
          EXTRA_CONFIG_IN: ${{ inputs.extra_config }}
          EXTRA_MAKE_IN: ${{ inputs.extra_make }}
          TC_SOURCE: ${{ inputs.toolchain_source }}
          DO_AK3: ${{ inputs.ak3 }}
          AK3_REPO_IN: ${{ inputs.ak3_repo }}
          AK3_STRING_IN: ${{ inputs.ak3_string }}
        run: |
          set -eu
          # ⚠️ 必须用 **bash 数组**，不能拼字符串再不加引号展开。
          # 拼字符串时任何含空格的值都会被 word-splitting 切成多个参数：
          #   --ak3-string "paperSU Kernel"  →  脚本收到 --ak3-string paperSU Kernel
          #   → "ERROR: 未知参数：Kernel"
          # 数组对含空格的路径、extra_config、extra_make 同样安全。
          ARGS=(--kernel-dir kernel-src
                --defconfig "$DEFCONFIG_IN"
                --arch "$ARCH_IN"
                --out "$PWD/kernel-out")

          if [ -n "$TARGET_IN" ];       then ARGS+=(--target "$TARGET_IN"); fi
          if [ -n "$KMI_IN" ];          then ARGS+=(--kmi "$KMI_IN"); fi
          if [ -n "$SUBLEVEL_IN" ];     then ARGS+=(--sublevel "$SUBLEVEL_IN"); fi
          if [ -n "$EXTRA_CONFIG_IN" ]; then ARGS+=(--extra-config "$EXTRA_CONFIG_IN"); fi
          if [ -n "$EXTRA_MAKE_IN" ];   then ARGS+=(--extra-make "$EXTRA_MAKE_IN"); fi

          # 4.x → GCC（红米 K20 Pro 就是 4.14）；5.x / 6.x → Clang(LLVM)
          if [ "${KVER_MAJOR:-}" = "4" ]; then
            echo "[+] 4.x 内核 → GCC 路径（prefix=${GCC_PREFIX:-aarch64-linux-android-}）"
            ARGS+=(--toolchain gcc --cross-compile "${GCC_PREFIX:-aarch64-linux-android-}")
            if [ -n "${GCC_DIR:-}" ]; then
              ARGS+=(--gcc-dir "$GCC_DIR")
            fi
            # 退回发行版 GCC 时上面已置 NO_CC_WRAPPER=1：老内核自带的
            # gcc-wrapper.py 会把新 GCC 报出的每个警告都当错误，必须绕过。
            if [ "${NO_CC_WRAPPER:-}" = "1" ]; then
              ARGS+=(--no-cc-wrapper)
            fi
          else
            case "$TC_SOURCE" in
              aosp|url)
                ARGS+=(--clang-dir "$PWD/toolchain/clang" --cross-compile aarch64-linux-gnu-)
                export PATH="$PWD/toolchain/clang/bin:$PATH" ;;
              runner)
                ARGS+=(--cross-compile aarch64-linux-gnu-) ;;
            esac
          fi

          if [ "$KSU_ENABLE" = "true" ]; then
            ARGS+=(--ksu-src "$PWD/ksu-src")
            if [ -n "$KSU_PACKAGE" ]; then ARGS+=(--ksu-package "$KSU_PACKAGE"); fi
            if [ -n "$KSU_SIZE2" ];   then ARGS+=(--ksu-size2 "$KSU_SIZE2"); fi
            if [ -n "$KSU_HASH2" ];   then ARGS+=(--ksu-hash2 "$KSU_HASH2"); fi
          fi

          if [ "$DO_AK3" = "true" ]; then
            ARGS+=(--ak3 --ak3-repo "$AK3_REPO_IN" --ak3-string "$AK3_STRING_IN")
          fi

          # 用 %q 逐项转义打印，方便直接复制出来手工重跑
          printf '=== build-kernel-generic.sh'
          printf ' %q' "${ARGS[@]}"
          printf ' ===\n'

          ./scripts/build-kernel-generic.sh "${ARGS[@]}"

      # ── 8. 产物 ──
      - name: Show results
        run: |
          echo "--- 编译产物 ---"
          find kernel-out -maxdepth 4 -name 'Image*' -o -maxdepth 4 -name 'zImage*' 2>/dev/null | head -20 || true
          echo "--- zip ---"
          find . -maxdepth 2 -name '*.zip' -printf '%p  %s bytes\n' || true

      - name: Upload AnyKernel3 zip
        if: inputs.ak3
        uses: actions/upload-artifact@v7
        with:
          name: paperSU-Xiaomi-${{ inputs.device_branch }}-AnyKernel3
          path: '*.zip'
          if-no-files-found: error
          retention-days: 30

      - name: Upload kernel image (no AK3 requested)
        if: ${{ !inputs.ak3 }}
        uses: actions/upload-artifact@v7
        with:
          name: paperSU-Xiaomi-${{ inputs.device_branch }}-Image
          path: |
            kernel-out/arch/*/boot/Image*
            kernel-out/arch/*/boot/zImage*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xiaomi-kernel-build-log
          # build.log 现在由脚本落盘：老内核 + 新 GCC 会产生成千上万条
          # 非致命警告，CI 日志会被截断，真正的 error 翻不到。
          # 完整日志在这里，且脚本失败时已把 error 行摘出来打在 job 日志里。
          path: |
            kernel-out/build.log
            kernel-out/.config
            kernel-out/include/config/kernel.release
          if-no-files-found: ignore
          retention-days: 7
